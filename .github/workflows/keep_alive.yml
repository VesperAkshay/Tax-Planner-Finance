name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Sending keep-alive heartbeat to taxplan-backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://taxplan-backend.onrender.com/health)
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Backend is active and healthy!"
          else
            echo "Warning: Received HTTP $STATUS"
          fi
