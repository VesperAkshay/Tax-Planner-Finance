<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Hard Drop Shadow for Neo-Brutalist Feel -->
  <rect x="7" y="7" width="50" height="50" rx="8" fill="#000000" />

  <!-- Main Indigo Badge -->
  <rect x="4" y="4" width="50" height="50" rx="8" fill="#3730A3" stroke="#000000" stroke-width="3.5" />

  <!-- Amber/Yellow FY26 Accent Pill -->
  <rect x="34" y="6" width="18" height="15" rx="3" fill="#FACC15" stroke="#000000" stroke-width="2" />
  <text x="43" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="900" text-anchor="middle" fill="#000000">26</text>

  <!-- Bold High-Contrast TP Initials -->
  <text x="23" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-1.5" text-anchor="middle" fill="#FFFFFF">TP</text>

  <!-- Emerald Green Active Vault / Zero-Drift Dot -->
  <circle cx="12" cy="46" r="3.5" fill="#10B981" stroke="#000000" stroke-width="1.5" />
</svg>