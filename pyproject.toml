[project]
name = "tax-planner"
version = "0.1.0"
description = "Personal Finance + Tax Regime Planner (FY 2025-26)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "sqlmodel>=0.0.16",
    "alembic>=1.13.0",
    "docling>=2.0.0",
    "pandas>=2.2.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "chromadb>=0.5.0",
    "langgraph>=0.2.0",
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
